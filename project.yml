name: DockFolders
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
options:
  bundleIdPrefix: com.esilverman
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    # Developer ID: macOS refuses to load an ad-hoc signed Dock tile plug-in (FolderDockMenu).
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: JXP2S296CC
    ENABLE_HARDENED_RUNTIME: YES # required for notarization
    # Overridden by scripts/release.sh (version from the tag, build number from the commit count).
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      OTHER_CODE_SIGN_FLAGS: --timestamp=none # day-to-day builds stay offline
    Release:
      OTHER_CODE_SIGN_FLAGS: --timestamp # notarization needs a secure timestamp
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO # no get-task-allow, which notarization rejects
      DEPLOYMENT_POSTPROCESSING: YES # strip symbols, which embed this Mac's source paths
targets:
  DockFolders:
    type: application
    platform: macOS
    sources: [DockFolders, Shared]
    dependencies:
      - package: Sparkle
      # The template every folder app is copied from.
      - target: FolderStub
        embed: true
        codeSign: false
        copy:
          destination: resources
    info:
      path: DockFolders/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DockFolders
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: the newest GitHub release always carries the feed.
        SUFeedURL: https://github.com/eric-silverman/dock-folders/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: JgvGso00otfqDFfyJuRxWg9ovbCoEM6KoZeh+rWz3Pw=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # rendered by scripts/make-icon.swift
    scheme:
      testTargets: [DockFoldersTests]
  FolderStub:
    type: application
    platform: macOS
    sources: [FolderStub, Shared]
    dependencies:
      # Gives each folder's Dock tile an "Edit Folder…" menu item while the folder app isn't running.
      - target: FolderDockMenu
        embed: true
        codeSign: false
        copy:
          destination: plugins
    info:
      path: FolderStub/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Folder
        DockFolderID: ""
        NSDockTilePlugIn: FolderDockMenu.docktileplugin
        # Lets the Dock accept files dropped on a folder tile. Rank None keeps folder apps out of
        # Finder's Open With menus and never makes them a default handler.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.FolderStub
        PRODUCT_NAME: DockFolders Folder # shown in System Settings > Login Items & Extensions
  FolderDockMenu:
    type: bundle
    platform: macOS
    sources: [FolderDockMenu, Shared/Folder.swift, Shared/ManagerRequest.swift]
    info:
      path: FolderDockMenu/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        NSPrincipalClass: DockMenuPlugIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.DockMenu
        WRAPPER_EXTENSION: docktileplugin
  DockFoldersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - DockFolders/DockPrefs.swift
      - DockFolders/StubGenerator.swift
      - FolderStub/FolderPanel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.Tests
        GENERATE_INFOPLIST_FILE: YES

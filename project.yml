name: DockFolders
options:
  bundleIdPrefix: com.esilverman
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  DockFolders:
    type: application
    platform: macOS
    sources: [DockFolders, Shared]
    dependencies:
      # The template every folder app is copied from.
      - target: FolderStub
        embed: true
        codeSign: false
        copy:
          destination: resources
    info:
      path: DockFolders/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DockFolders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders
    scheme:
      testTargets: [DockFoldersTests]
  FolderStub:
    type: application
    platform: macOS
    sources: [FolderStub, Shared]
    dependencies:
      # Gives each folder's Dock tile an "Edit Folder…" menu item while the folder app isn't running.
      - target: FolderDockMenu
        embed: true
        codeSign: false
        copy:
          destination: plugins
    info:
      path: FolderStub/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Folder
        DockFolderID: ""
        NSDockTilePlugIn: FolderDockMenu.docktileplugin
        # Lets the Dock accept files dropped on a folder tile. Rank None keeps folder apps out of
        # Finder's Open With menus and never makes them a default handler.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Viewer
            LSHandlerRank: None
            LSItemContentTypes: [public.item]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.FolderStub
  FolderDockMenu:
    type: bundle
    platform: macOS
    sources: [FolderDockMenu, Shared/Folder.swift, Shared/ManagerRequest.swift]
    info:
      path: FolderDockMenu/Info.plist
      properties:
        CFBundleExecutable: $(EXECUTABLE_NAME)
        NSPrincipalClass: DockMenuPlugIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.DockMenu
        WRAPPER_EXTENSION: docktileplugin
  DockFoldersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - DockFolders/DockPrefs.swift
      - DockFolders/StubGenerator.swift
      - FolderStub/FolderPanel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.Tests
        GENERATE_INFOPLIST_FILE: YES

name: DockFolders
options:
  bundleIdPrefix: com.esilverman
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  DockFolders:
    type: application
    platform: macOS
    sources: [DockFolders, Shared]
    dependencies:
      # The template every folder app is copied from.
      - target: FolderStub
        embed: true
        codeSign: false
        copy:
          destination: resources
    info:
      path: DockFolders/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: DockFolders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders
    scheme:
      testTargets: [DockFoldersTests]
  FolderStub:
    type: application
    platform: macOS
    sources: [FolderStub, Shared]
    info:
      path: FolderStub/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Folder
        DockFolderID: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.FolderStub
  DockFoldersTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.esilverman.DockFolders.Tests
        GENERATE_INFOPLIST_FILE: YES
